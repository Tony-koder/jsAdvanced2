<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>GameLogger</title>
</head>
<body>
    <header></header>
    <main>
        <h1>Welcome to GameLogger!</h1>
        <section>
            <!-- Making the gamelogger itself -->
            <form id="gameLoggerForm">
                <label for="gameName">
                    Game Name:
                    <input type="text" name="gameName">
                </label>

                <label for="status">
                    status:
                    <input type="text" name="status">
                </label>

                <label for="picture">
                    picture url:
                    <input type="text" name="picture">
                </label>

                <label for="rating">
                    rating:
                    <input type="number" name="rating">
                </label>

                <button type="submit">Submit</button>
            </form>

            <div id="gameContainer">

            </div>
        </section>
        
    </main>
    
</body>
</html>
